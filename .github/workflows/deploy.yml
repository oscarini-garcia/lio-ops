name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test and build
        working-directory: app
        env:
          VITE_JSONBIN_ID: ${{ vars.VITE_JSONBIN_ID }}
          VITE_JSONBIN_KEY: ${{ vars.VITE_JSONBIN_KEY }}
        run: |
          npm install
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist
      - uses: actions/deploy-pages@v5
        id: deployment
