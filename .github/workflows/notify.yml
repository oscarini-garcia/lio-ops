name: Avisos push
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enviar avisos pendientes
        env:
          TZ: Europe/Madrid
          JSONBIN_ID: ${{ vars.VITE_JSONBIN_ID }}
          JSONBIN_KEY: ${{ vars.VITE_JSONBIN_KEY }}
          ONESIGNAL_APP_ID: ${{ vars.VITE_ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: node scripts/notify.mjs
